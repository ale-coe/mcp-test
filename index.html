<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Send a Message</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #f3f2ff; background: radial-gradient(circle at 20% 15%, #36346c 0, transparent 38%), radial-gradient(circle at 80% 85%, #283e69 0, transparent 36%), #10111d; }
    .card { width: min(100%, 620px); padding: clamp(24px, 5vw, 40px); background: rgba(24, 25, 43, .84); border: 1px solid rgba(255,255,255,.12); border-radius: 24px; box-shadow: 0 24px 70px rgba(0,0,0,.35); backdrop-filter: blur(16px); }
    .eyebrow { margin: 0 0 10px; color: #aaa4ff; font-size: .75rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0 0 8px; font-size: clamp(1.8rem, 5vw, 2.5rem); letter-spacing: -.04em; }
    .sub { margin: 0 0 28px; color: #aaaabe; line-height: 1.5; }
    label { display: block; font-size: .9rem; font-weight: 650; margin-bottom: 10px; }
    textarea { display: block; width: 100%; min-height: 190px; padding: 19px; resize: vertical; border: 1px solid #414159; outline: none; border-radius: 16px; font: inherit; font-size: 1rem; line-height: 1.55; color: #fff; background: #161827; transition: border-color .2s, box-shadow .2s; }
    textarea::placeholder { color: #77788d; }
    textarea:focus { border-color: #a199ff; box-shadow: 0 0 0 4px rgba(161,153,255,.13); }
    .footer { display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-top: 16px; }
    .count { font-size: .8rem; color: #9999ad; font-variant-numeric: tabular-nums; }
    button { border: 0; padding: 13px 24px; border-radius: 12px; font: inherit; font-weight: 750; color: #111124; background: linear-gradient(120deg, #beb8ff, #8edcf9); cursor: pointer; transition: transform .15s, filter .15s, opacity .15s; }
    button:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.08); }
    button:disabled { cursor: not-allowed; opacity: .5; }
    .status { min-height: 1.4em; margin: 16px 0 0; font-size: .88rem; color: #a6edcb; } .status.error { color: #ffaaaa; }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Message studio</p>
    <h1>What's on your mind?</h1>
    <p class="sub">Write something great, then send it straight to your backend.</p>
    <form id="messageForm">
      <label for="message">Your message</label>
      <textarea id="message" name="message" maxlength="2000" required placeholder="Start typing your message here…"></textarea>
      <div class="footer">
        <span class="count"><span id="characterCount">0</span> / 2000 characters</span>
        <button id="sendButton" type="submit" disabled>Send message ↗</button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script>
    // Change this URL to match your backend endpoint.
    const API_URL = 'http://localhost:3000/prompt';

    const form = document.querySelector('#messageForm');
    const message = document.querySelector('#message');
    const count = document.querySelector('#characterCount');
    const button = document.querySelector('#sendButton');
    const status = document.querySelector('#status');
    let sending = false;

    message.addEventListener('input', () => {
      count.textContent = message.value.length;
      button.disabled = sending || !message.value.trim();
      status.textContent = '';
      status.classList.remove('error');
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const prompt = message.value.trim();
      if (!prompt || sending) return;

      sending = true;
      button.disabled = true;
      button.textContent = 'Sending…';
      status.textContent = '';
      status.classList.remove('error');

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });
        if (!response.ok) throw new Error(`Request failed (HTTP ${response.status})`);
        message.value = '';
        count.textContent = '0';
        status.textContent = '✓ Message sent successfully!';
      } catch (error) {
        status.textContent = `Could not send message: ${error.message}`;
        status.classList.add('error');
      } finally {
        sending = false;
        button.textContent = 'Send message ↗';
        button.disabled = !message.value.trim();
      }
    });
  </script>
</body>
</html>
